name: Publish GBP/USD sentiment

on:
  schedule:
    # Hourly. GitHub's `schedule` is best-effort (see the oil workflow's note about it
    # firing hours late) -- fine here: the score uses a 6h half-life and the app shows the
    # file's age and ignores it once stale, so a late or skipped run just means a staler
    # reading, never a wrong one.
    - cron: '7 * * * *'
  workflow_dispatch: {}  # manual "Run workflow" button, for testing

permissions:
  contents: write  # commits data/sentiment*.json back to the repo

concurrency:
  group: publish-sentiment
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Optional repo secret. Unset -> empty string -> the offline rule scorer is used.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Claude SDK (only when LLM scoring is enabled)
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -q anthropic

      - name: Score news and publish sentiment
        run: python scripts/publish_sentiment.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sentiment.json data/sentiment-history.json data/sentiment-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Update GBP/USD sentiment $(date -u +%Y-%m-%dT%H:%MZ)"
          # The oil workflow pushes to this same branch -- rebase and retry rather than fail
          # the run (and lose an hour's reading) on a non-fast-forward.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
