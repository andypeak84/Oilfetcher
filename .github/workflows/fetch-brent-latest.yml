name: Record latest Brent (OilPriceAPI)

on:
  schedule:
    # 19:45 UTC every weekday: after Brent's settlement and before the app's 21:00 UTC refresh, so the reading is that day's close and dates line up with the app's target day. One call a day (free plan). GitHub's schedule is best-effort and may run late.
    - cron: '45 19 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest Brent
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: python scripts/fetch_brent_latest.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brent-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update latest Brent $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
